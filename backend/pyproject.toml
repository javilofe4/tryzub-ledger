[project]
name = "tryzub_ledger_backend"
version = "0.1.0"
description = "Tryzub Ledger backend API and ingestion services"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0"}
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.23",
  "sqlalchemy>=2.0",
  "asyncpg>=0.27",
  "psycopg2-binary>=2.9",
  "geoalchemy2>=0.14",
  "alembic>=1.11",
  "pydantic>=2.6",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.1",
  "celery[redis]>=5.4",
  "httpx>=0.27",
  "python-multipart>=0.0.6"
]

[project.scripts]
tryzub-seed-sources = "app.scripts.seed_sources:main"
tryzub-ingest = "app.scripts.ingest:main"
[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=0.22",
  "httpx>=0.27",
  "flake8>=6.0",
  "mypy>=1.10"
]
[build-system]
requires = ["setuptools>=61","wheel"]
build-backend = "setuptools.build_meta"
